<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Lot C — directions visuelles Tâches & Bloc-notes (maquettes statiques)</title>
<style>
@font-face{font-family:'Bricolage Grotesque Variable';src:url('../../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2');font-weight:200 800}
@font-face{font-family:'Instrument Sans Variable';src:url('../../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2');font-weight:400 700}
@font-face{font-family:'Montserrat Variable';src:url('../../../node_modules/@fontsource-variable/montserrat/files/montserrat-latin-wght-normal.woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{font-family:'Instrument Sans Variable',sans-serif;background:#222;padding:24px;display:grid;gap:24px}
.stage{position:relative;border-radius:20px;overflow:hidden;padding:28px;display:flex;gap:24px;justify-content:center;align-items:flex-start;min-height:560px;
  background:radial-gradient(120% 90% at 20% 10%,#3d8f9c 0%,#25506a 45%,#16293d 100%)}
.stage.light{background:radial-gradient(120% 90% at 20% 10%,#f4e6cf 0%,#d9c3a4 50%,#a9b9b2 100%)}
.label{position:absolute;top:10px;left:14px;font:600 11px 'Montserrat Variable';letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.light .label{color:rgba(0,0,0,.6)}
.panel{width:340px;border-radius:var(--r-panel);padding:18px;color:var(--text);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.panel h2{font:var(--h-font);font-size:var(--h-size);letter-spacing:var(--h-ls);text-transform:var(--h-tt)}
.hdr{display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;margin:-12px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.add{display:flex;gap:8px}
.add .in{flex:1;height:44px;border-radius:var(--r-row);border:1px solid var(--line);padding:0 12px;display:flex;align-items:center;color:var(--muted);font-size:14px}
.add .btn{width:44px;height:44px;border-radius:var(--r-row);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:22px;font-weight:500}
.rows{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;align-items:center;gap:10px;min-height:var(--row-h);padding:4px 8px;border-radius:var(--r-row);position:relative}
.row.active{background:color-mix(in oklab,var(--accent) 14%,transparent)}
.row.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.cb{width:22px;height:22px;flex:none;border:1.75px solid var(--cb-line);border-radius:var(--r-cb);display:grid;place-items:center}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb svg{width:13px;height:13px;stroke:var(--on-accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.t{flex:1;font-size:15px;line-height:1.25}
.t.done{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--muted) 60%,transparent)}
.pill{font:600 10.5px 'Montserrat Variable';letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sub{margin-left:32px}
.foot{display:flex;gap:16px;font-size:13px;color:var(--muted);padding-top:2px}
.bar{display:flex;gap:2px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}
.bar span{width:36px;height:36px;display:grid;place-items:center;font-size:14px;border-radius:8px}
.bar span.on{color:var(--text);background:var(--hover)}
.doc{font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:8px;min-height:250px}
.doc h3{font:var(--doc-h-font);font-size:var(--doc-h-size);line-height:1.2;letter-spacing:-.01em}
.doc blockquote{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--muted);font-style:italic}
.doc ul{padding-left:20px}
.doc .ck{display:flex;gap:8px;align-items:center}
.doc .ck i{width:16px;height:16px;border:1.5px solid var(--cb-line);border-radius:5px;flex:none}
.doc .ck i.on{background:var(--accent);border-color:var(--accent)}
.status{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);align-items:center}
.status b{font-weight:500;display:flex;align-items:center;gap:6px}
.status b::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ——— Direction A : « Papier & encre » ——— */
.A{--r-panel:20px;--r-row:12px;--r-cb:7px;--gap:2px;--row-h:48px;
  --h-font:600 17px 'Bricolage Grotesque Variable';--h-size:17px;--h-ls:-.01em;--h-tt:none;
  --doc-h-font:650 20px 'Bricolage Grotesque Variable';--doc-h-size:20px;
  --shadow:0 1px 0 rgba(255,255,255,.5) inset,0 18px 40px -12px rgba(0,0,0,.35)}
.A.t-light{--surface:#fbf8f2;--text:#231f1a;--muted:#6b6358;--line:rgba(35,31,26,.14);--hover:rgba(35,31,26,.07);--cb-line:#8d8477;--accent:#0f7f8c;--accent-text:#0b6672;--on-accent:#fff}
.A.t-dark{--surface:#1c1a17;--text:#f3eee6;--muted:#a79f92;--line:rgba(243,238,230,.14);--hover:rgba(243,238,230,.08);--cb-line:#7d766b;--accent:#4fc3d0;--accent-text:#7dd6e0;--on-accent:#06242a;--shadow:0 18px 40px -12px rgba(0,0,0,.6)}
/* ——— Direction B : « Verre teinté » ——— */
.B{--r-panel:26px;--r-row:14px;--r-cb:50%;--gap:4px;--row-h:44px;
  --h-font:700 12px 'Montserrat Variable';--h-size:12px;--h-ls:.1em;--h-tt:uppercase;
  --doc-h-font:600 19px 'Bricolage Grotesque Variable';--doc-h-size:19px}
.B .panel{backdrop-filter:blur(26px) saturate(140%)}
.B.t-light{--surface:rgba(255,252,246,.74);--text:#1d2a30;--muted:#51636b;--line:rgba(29,42,48,.16);--hover:rgba(29,42,48,.08);--cb-line:#5d727b;--accent:#0b7a8a;--accent-text:#0a6573;--on-accent:#fff;--shadow:0 20px 50px -16px rgba(20,40,50,.45)}
.B.t-dark{--surface:rgba(14,28,40,.66);--text:#eef5f7;--muted:#a5b9c1;--line:rgba(238,245,247,.18);--hover:rgba(238,245,247,.1);--cb-line:#8aa2ac;--accent:#6fd3df;--accent-text:#8fe0ea;--on-accent:#05232a;--shadow:0 20px 50px -16px rgba(0,0,0,.6)}
</style>
</head>
<body>
<template id="tpl">
<div class="panel">
  <div class="hdr"><h2>Tâches</h2><span class="x">✕</span></div>
  <div class="add"><div class="in">Nouvelle tâche…</div><div class="btn">+</div></div>
  <div class="rows">
    <div class="row active"><span class="cb"></span><span class="t">Réviser la pharmacologie</span><span class="pill"><i></i>Médecine</span></div>
    <div class="row"><span class="cb on"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></span><span class="t done">Rédiger le rapport de stage</span></div>
    <div class="row"><span class="cb"></span><span class="t">Appeler le médecin</span></div>
    <div class="row sub"><span class="cb"></span><span class="t">Prendre rendez-vous</span></div>
  </div>
  <div class="foot"><span>Archiver les terminées</span><span>Archives (2)</span></div>
</div>
<div class="panel">
  <div class="hdr"><h2>Bloc-notes</h2><span class="x">✕</span></div>
  <div class="bar"><span class="on"><b>B</b></span><span><i>I</i></span><span>H</span><span>•</span><span>☑</span></div>
  <div class="doc">
    <h3>Idées pour la semaine</h3>
    <p>Relire les cours d’anatomie avant jeudi, puis faire un point sur les objectifs.</p>
    <blockquote>« La médecine est une science de l’incertitude. »</blockquote>
    <ul><li>Fiche pharmaco</li><li>Planning de stage</li></ul>
    <div class="ck"><i class="on"></i>Envoyer le rapport</div>
    <div class="ck"><i></i>Réserver la salle</div>
  </div>
  <div class="status"><span>24 mots · 138 caractères</span><b>Enregistré</b></div>
</div>
</template>
<script>
const tpl=document.getElementById('tpl')
for(const [dir,name] of [['A','Direction A — Papier & encre'],['B','Direction B — Verre teinté']])
 for(const th of ['dark','light']){
  const s=document.createElement('section');s.className='stage '+th+' '+dir+' t-'+th;s.id=dir+'-'+th
  s.innerHTML='<span class="label">'+name+' · '+(th==='dark'?'sombre':'clair')+'</span>'
  s.appendChild(tpl.content.cloneNode(true));document.body.appendChild(s)
 }
</script>
</body>
</html>
